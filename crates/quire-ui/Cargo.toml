[package]
name = "quire-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native viewer shell for Quire"
publish = false

[lib]
name = "quire_ui"
path = "src/lib.rs"

[[bin]]
name = "quire-view"
path = "src/bin/quire-view.rs"

[dependencies]
quire-base.workspace = true
quire-model.workspace = true
quire-io.workspace = true
quire-text.workspace = true
quire-layout.workspace = true
quire-edit.workspace = true
quire-paint.workspace = true
anyhow.workspace = true
clap.workspace = true
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
resvg = "0.45"
usvg = "0.45"
tiny-skia = "0.11"
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts"] }
egui = "0.31"
